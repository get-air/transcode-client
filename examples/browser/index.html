<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Air transcode fallback</title>
  </head>
  <body>
    <main>
      <header class="topbar">
        <div>
          <h1>Air transcode fallback</h1>
          <p>Paste any media URL. GStreamer converts it to buffered browser-safe HLS.</p>
        </div>
        <output id="backend" aria-live="polite">Idle</output>
      </header>
      <form id="source-form">
        <label class="source-field">Media URL <input id="source" type="url" autocomplete="off" required></label>
        <label>Transcoder origin <input id="origin" type="url" required value="http://127.0.0.1:11472"></label>
        <button type="submit">Play URL</button>
      </form>
      <section class="player-shell" aria-label="Media player">
        <video id="video" controls playsinline></video>
        <div id="track-controls" class="track-controls" hidden>
          <label id="audio-track-field" hidden>Audio track
            <select id="audio-track"></select>
          </label>
          <label id="subtitle-track-field" hidden>Subtitles
            <select id="subtitle-track"></select>
          </label>
          <div id="seek-field" class="seek-field" hidden>
            <label>Seek position (seconds)
              <input id="seek-position" type="number" min="0" step="0.1" value="0">
            </label>
            <button id="seek-button" type="button">Seek</button>
          </div>
        </div>
      </section>
      <p id="status" role="status" aria-live="polite">Enter a media URL to transcode.</p>
      <pre id="diagnostics" aria-label="Playback diagnostics">No active session.</pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
